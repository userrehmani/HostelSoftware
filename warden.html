<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#059669">
  <link rel="manifest" href="manifest.json">
  <title>Warden Operations Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

  <div id="wardenLoginBox" class="max-w-md mx-auto mt-16 bg-slate-900 border border-emerald-500/30 rounded-2xl p-8 shadow-2xl space-y-5">
    <div class="text-center">
      <div class="w-14 h-14 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-2xl mx-auto mb-3">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h1 class="text-xl font-bold">Private Warden Portal</h1>
      <p class="text-xs text-slate-400">Authorized Hostel Operations Staff Only</p>
    </div>
    <form onsubmit="loginWarden(event)" class="space-y-4 text-xs sm:text-sm">
      <input id="wUser" value="warden" required type="text" placeholder="Warden Username" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white">
      <input id="wPass" required type="password" placeholder="Enter Warden Password" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white">
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl">Login to Warden Console</button>
    </form>
  </div>

  <div id="wardenApp" class="hidden max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <header class="bg-slate-900 border border-emerald-500/30 rounded-2xl p-4 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-white">👮 Warden Operations Console</h1>
        <p class="text-xs text-emerald-400">Gate Attendance, Outing Leaves, Sub-Meter Readings, Visitors & Maintenance</p>
      </div>
      <div class="flex gap-2">
        <button onclick="installHostelPWA()" class="bg-emerald-600/20 text-emerald-300 px-3 py-1.5 rounded-lg text-xs">Install App</button>
        <button onclick="location.reload()" class="bg-slate-800 hover:bg-rose-600 px-3 py-1.5 rounded-lg text-xs">Logout</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-base font-bold text-emerald-400">Student Leave Approvals & Gate In/Out</h2>
        <div id="wardenLeavesList" class="space-y-2 text-xs"></div>
        <hr class="border-slate-800">
        <div id="wardenGateList" class="space-y-2 text-xs"></div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-base font-bold text-amber-400">Complaints & Maintenance Resolution</h2>
        <div id="wardenComplaintsList" class="space-y-2 text-xs"></div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-base font-bold text-indigo-400">Room Sub-Meter Electricity Entry</h2>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
          <select id="wRoomSelect" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-white"></select>
          <input id="wPrev" type="number" placeholder="Prev Units" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-white">
          <input id="wCurr" type="number" placeholder="Curr Units" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-white">
          <input id="wRate" type="number" placeholder="Rate/Unit" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-white">
          <button onclick="wardenApplyMeter()" class="bg-emerald-600 text-white font-bold rounded-lg px-3 py-2">Split Bill</button>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-base font-bold text-purple-400">Gate Visitor Logbook</h2>
        <form onsubmit="wardenAddVisitor(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
          <input id="vName" required placeholder="Visitor Name" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white">
          <input id="vStu" required placeholder="Meeting Student" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white">
          <button type="submit" class="bg-purple-600 text-white font-bold rounded-lg px-3 py-2">+ Log Visitor</button>
        </form>
        <div id="wardenVisitorsList" class="space-y-2 text-xs"></div>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    function loginWarden(e) {
      e.preventDefault();
      const db = getDB();
      if (document.getElementById("wUser").value.trim().toLowerCase() === "warden" && document.getElementById("wPass").value === db.settings.wardenPass) {
        document.getElementById("wardenLoginBox").classList.add("hidden");
        document.getElementById("wardenApp").classList.remove("hidden");
        renderWardenConsole();
      } else {
        alert("Wrong Warden password!");
      }
    }

    function renderWardenConsole() {
      const db = getDB();
      document.getElementById("wardenLeavesList").innerHTML = db.leaves.length ? db.leaves.map(l => `
        <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center">
          <span><strong>${l.studentName} (${l.room}):</strong> ${l.reason} (${l.fromDate} - ${l.returnDate})</span>
          ${l.status === "Pending" ? `<button onclick="approveLeave('${l.id}')" class="bg-emerald-600 text-white px-3 py-1 rounded font-bold">Approve</button>` : `<span class="text-emerald-400 font-bold">${l.status}</span>`}
        </div>
      `).join("") : `<p class="text-slate-500">No leave requests yet.</p>`;

      document.getElementById("wardenGateList").innerHTML = db.students.length ? db.students.map(s => `
        <div class="p-2.5 bg-slate-950 rounded-lg border border-slate-800 flex justify-between items-center">
          <span><strong>${s.name}</strong> (${s.id} - ${s.room})</span>
          <button onclick="toggleGate('${s.id}')" class="px-2.5 py-1 rounded font-bold ${s.gateStatus === 'Inside' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}">${s.gateStatus}</button>
        </div>
      `).join("") : `<p class="text-slate-500">No students admitted yet.</p>`;

      document.getElementById("wardenComplaintsList").innerHTML = db.complaints.length ? db.complaints.map(c => `
        <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center">
          <span><strong>[${c.priority}] ${c.category} (${c.room}):</strong> ${c.issue}</span>
          ${c.status !== "Resolved" ? `<button onclick="resolveComp('${c.id}')" class="bg-emerald-600 text-white px-3 py-1 rounded font-bold">Resolve</button>` : `<span class="text-emerald-400 font-bold">Resolved</span>`}
        </div>
      `).join("") : `<p class="text-slate-500">No complaints logged.</p>`;

      document.getElementById("wRoomSelect").innerHTML = db.rooms.map(r => `<option value="${r.id}">${r.id}</option>`).join("");

      document.getElementById("wardenVisitorsList").innerHTML = db.visitors.map(v => `
        <div class="p-2 bg-slate-950 rounded border border-slate-800 flex justify-between">
          <span><strong>${v.visitorName}</strong> → ${v.studentName}</span>
          <span class="text-emerald-400">${v.timeIn}</span>
        </div>
      `).join("");
    }

    function approveLeave(id) {
      const db = getDB();
      const lv = db.leaves.find(l => l.id === id);
      if (lv) lv.status = "Approved";
      saveDB(db, `Warden approved leave ${id}`, "Warden");
      renderWardenConsole();
    }

    function toggleGate(id) {
      const db = getDB();
      const s = db.students.find(st => st.id === id);
      if (s) s.gateStatus = s.gateStatus === "Inside" ? "Out of Hostel" : "Inside";
      saveDB(db, `Warden marked ${s.name} ${s.gateStatus}`, "Warden");
      renderWardenConsole();
    }

    function resolveComp(id) {
      const db = getDB();
      const c = db.complaints.find(x => x.id === id);
      if (c) c.status = "Resolved";
      saveDB(db, `Warden resolved complaint ${id}`, "Warden");
      renderWardenConsole();
    }

    function wardenApplyMeter() {
      const db = getDB();
      const roomId = document.getElementById("wRoomSelect").value;
      const units = Math.max(0, (Number(document.getElementById("wCurr").value) || 0) - (Number(document.getElementById("wPrev").value) || 0));
      const rate = Number(document.getElementById("wRate").value) || 0;
      const bill = units * rate;
      const occupants = db.students.filter(s => s.room === roomId && s.status === "Active");
      if (!occupants.length) return alert("No students in this room!");
      const share = Math.round(bill / occupants.length);
      occupants.forEach(s => s.elec = share);
      saveDB(db, `Warden applied Rs.${share} electricity share to ${roomId}`, "Warden");
      alert(`Applied Rs. ${share}/student to ${occupants.length} occupants in ${roomId}.`);
    }

    function wardenAddVisitor(e) {
      e.preventDefault();
      const db = getDB();
      db.visitors.unshift({
        id: "VIS-" + Date.now(),
        visitorName: document.getElementById("vName").value,
        studentName: document.getElementById("vStu").value,
        timeIn: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      saveDB(db, "Warden logged visitor", "Warden");
      e.target.reset();
      renderWardenConsole();
    }
  </script>
</body>
</html>
